<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>De Seconde Home – Ảnh thực tế các phòng</title>
<meta name="description" content="Ảnh thực tế các phòng De Seconde Home – chi nhánh Lê Minh Xuân và Trương Hoàng Thanh, gần sân bay Tân Sơn Nhất.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
*{box-sizing:border-box}
body{margin:0;background:#F3F5F4;color:#17262A;font-family:'Be Vietnam Pro',system-ui,sans-serif}
a{color:#1F6F64}a:hover{color:#17544B}
button{font-family:inherit}
.wrap{max-width:1200px;margin:0 auto;padding:0 24px}
header.top{background:#fff;border-bottom:1px solid #E1E6E4}
header.top .wrap{display:flex;align-items:center;gap:14px;padding-top:14px;padding-bottom:14px}
.logo{display:inline-flex;flex-direction:column;align-items:center;font-family:'Montserrat',sans-serif;color:#17262A;line-height:1}
.logo .de{font-size:34px;letter-spacing:1.4px}
.logo .sm{font-size:10px;letter-spacing:.8px;margin-top:2px}
.logo .sm:first-of-type{margin-top:3px}
.vbar{width:1px;height:44px;background:#E1E6E4}
.sub{font-size:14px;color:#5A6B6E}
.sticky{position:sticky;top:0;z-index:20;background:rgba(243,245,244,.94);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-bottom:1px solid #E1E6E4}
.sticky .wrap{padding-top:12px;padding-bottom:12px}
.seg{display:flex;gap:4px;padding:4px;border-radius:999px;background:#E3EBE8;width:fit-content;max-width:100%;overflow-x:auto}
.seg button{flex-shrink:0;min-height:52px;padding:0 22px;border-radius:999px;border:none;background:transparent;color:#17262A;font-size:16px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;transition:background-color .25s,color .25s,box-shadow .25s,transform .15s}
.seg button .n{padding:2px 8px;border-radius:999px;background:#fff;color:#3F5653;font-size:13px;font-weight:600}
.seg button[aria-pressed=true]{background:#1F6F64;color:#fff;font-weight:700;box-shadow:0 2px 8px rgba(31,111,100,.35)}
.seg button[aria-pressed=true] .n{background:rgba(255,255,255,.22);color:#fff}
.seg button:active{transform:scale(.96)}
main .wrap{padding-top:8px;padding-bottom:64px;display:flex;flex-direction:column;gap:24px}
.branch{display:flex;flex-direction:column;gap:24px;padding-top:24px}
.bhead{display:flex;flex-direction:column;gap:4px;padding-bottom:12px;border-bottom:2px solid #1F6F64}
.eyebrow{font-size:13px;font-weight:600;letter-spacing:1px;text-transform:uppercase;color:#1F6F64}
.bname{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.bname h2{margin:0;font-size:32px;font-weight:700}
.newb{padding:4px 10px;border-radius:8px;background:#D9480F;color:#fff;font-size:13px;font-weight:700;letter-spacing:.8px}
.binfo{display:flex;flex-wrap:wrap;align-items:center;gap:8px 16px}
.addr{display:inline-flex;align-items:center;gap:6px;font-size:15px;color:#3F5653}
.muted{font-size:14px;color:#5A6B6E}
.mapbtn{display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:0 14px;border-radius:999px;background:#1F6F64;color:#fff!important;text-decoration:none;font-size:14px;font-weight:600}
.type{display:flex;flex-direction:column;gap:20px}
.thead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:14px 18px;border-radius:14px;background:#fff;border:1px solid #E1E6E4;border-left:4px solid #1F6F64}
.thead h3{margin:0;font-size:26px;font-weight:700}
.chips{display:inline-flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;padding:6px 12px;border-radius:999px;background:#E3F1EC;color:#17544B;font-size:14px;font-weight:700}
.room{display:flex;flex-direction:column;gap:12px;scroll-margin-top:96px}
.rhead{display:flex;flex-wrap:wrap;align-items:baseline;gap:8px 16px}
.rhead h4{margin:0;font-size:22px;font-weight:700}
.kbtn{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid #1F6F64;background:#fff;color:#1F6F64;font-size:14px;font-weight:600;cursor:pointer}
.note{margin:0;font-size:14px;color:#5A6B6E}
.empty{height:180px;border-radius:12px;border:1px dashed #CBD4D1;background:#fff;display:flex;align-items:center;justify-content:center;color:#5A6B6E;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));grid-auto-rows:180px;grid-auto-flow:dense;gap:8px}
.ph{padding:0;border:none;border-radius:12px;overflow:hidden;background:#DCE5E2;cursor:zoom-in;transition:transform .35s ease,box-shadow .35s ease}
.ph.big{grid-column:span 2;grid-row:span 2}
.ph img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .6s cubic-bezier(.2,.7,.2,1),filter .4s ease}
.ph:hover{transform:translateY(-3px);box-shadow:0 12px 28px rgba(23,38,42,.18)}
.ph:hover img{transform:scale(1.06);filter:brightness(1.04)}
@keyframes up{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes zoom{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.anim{animation:up .6s cubic-bezier(.2,.7,.2,1) both}
.ph{animation:up .5s cubic-bezier(.2,.7,.2,1) both}
.ph:nth-child(2){animation-delay:.05s}.ph:nth-child(3){animation-delay:.1s}.ph:nth-child(4){animation-delay:.15s}.ph:nth-child(5){animation-delay:.2s}.ph:nth-child(6){animation-delay:.25s}.ph:nth-child(n+7){animation-delay:.3s}
.lb{position:fixed;inset:0;z-index:50;background:rgba(10,16,18,.94);display:none;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;animation:fade .25s ease both}
.lb.open{display:flex}
.lb img{max-width:100%;max-height:calc(100vh - 160px);object-fit:contain;border-radius:8px;animation:zoom .35s cubic-bezier(.2,.7,.2,1) both}
.lb .bar{display:flex;align-items:center;gap:16px;color:#fff}
.lb .cap{font-size:15px;text-align:center;min-width:200px}
.nav{width:48px;height:48px;border-radius:50%;border:none;background:rgba(255,255,255,.14);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:background-color .2s,transform .15s}
.nav:hover{background:rgba(255,255,255,.28)}
.nav:active{transform:scale(.92)}
.lb .close{position:absolute;top:16px;right:16px}
@media (max-width:600px){
.wrap{padding:0 14px}
.logo .de{font-size:28px}.logo .sm{font-size:9px}
.seg button{min-height:46px;padding:0 16px;font-size:14px}
.bname h2{font-size:26px}.thead h3{font-size:22px}.rhead h4{font-size:20px}
.grid{grid-template-columns:repeat(2,minmax(0,1fr));grid-auto-rows:140px}
.lb{padding:12px}.lb .cap{min-width:0;font-size:13px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

: "images/bep-chung-truong-hoang-thanh/thumb/01.jpg"}, {"cap": "Bếp chung và tủ lạnh lớn", "src": "images/bep-chung-truong-hoang-thanh/02.jpg", "thumb": "images/bep-chung-truong-hoang-thanh/thumb/02.jpg"}, {"cap": "Quầy bếp đá đen và kệ gia vị", "src": "images/bep-chung-truong-hoang-thanh/03.jpg", "thumb": "images/bep-chung-truong-hoang-thanh/thumb/03.jpg"}, {"cap": "Quầy bar cạnh cửa sổ", "src": "images/bep-chung-truong-hoang-thanh/04.jpg", "thumb": "images/bep-chung-truong-hoang-thanh/thumb/04.jpg"}]};
const BR = [
 { id: 'lmx', name: 'Lê Minh Xuân', isNew: true, address: '140/12 Lê Minh Xuân, Phường Tân Sơn Nhất, TP.HCM', map: 'https://maps.app.goo.gl/6yNHSdm3X7gpYzvQA' },
 { id: 'thth', name: 'Trương Hoàng Thanh', address: '32/27 Trương Hoàng Thanh, Phường Bảy Hiền, TP.HCM', map: 'https://maps.app.goo.gl/WKeZAbP6gu9M6rdY8' }
];
const TY = [
 { id: 'cozy', name: 'Cozy Standard', desc: 'View cửa sổ, ban công nhỏ' },
 { id: 'master', name: 'Master', desc: 'Phòng rộng 40m², bếp riêng, tủ đồ' },
 { id: 'cinema', name: 'Cinema', desc: 'Ban công lớn, TV/máy chiếu, bếp riêng' },
 { id: 'suite', name: 'Suite', desc: 'Ban công lớn, máy chiếu, bồn tắm' }
];
const PIN = '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21s-7-6.2-7-11a7 7 0 0 1 14 0c0 4.8-7 11-7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>';
const TICK = '<svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>';
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const chips = (t) => '<span class="chips">' + String(t || '').split(/\s*[·+,]\s*/).filter(Boolean).map((x) => '<span class="chip">' + TICK + esc(x) + '</span>').join('') + '</span>';
const sets = {}; D.rooms.forEach((r) => { sets[r.code] = { label: r.title, photos: r.photos }; });
sets.KIT = { label: 'Bếp chung Trương Hoàng Thanh', photos: D.kitchen };
let branch = 'lmx';

function grid(key) {
  const p = sets[key].photos;
  if (!p.length) return '<div class="empty">Ảnh phòng đang được cập nhật</div>';
  return '<div class="grid">' + p.map((x, i) => '<button class="ph' + (i === 0 ? ' big' : '') + '" data-k="' + key + '" data-i="' + i + '" aria-label="Phóng to: ' + esc(sets[key].label + ' – ' + x.cap) + '"><img loading="lazy" src="' + (i === 0 ? x.src : x.thumb) + '" alt="' + esc(sets[key].label + ' – ' + x.cap) + '"></button>').join('') + '</div>';
}
function room(r) {
  let h = '<section class="room anim" id="phong-' + r.code.toLowerCase() + '"><div class="rhead"><h4>' + esc(r.title) + '</h4>';
  if (!r.type) h += chips(r.tag);
  h += '<span class="muted">' + r.photos.length + ' ảnh</span>';
  if (r.branch === 'thth') h += '<button class="kbtn" data-k="KIT" data-i="0">Dùng bếp chung · xem ảnh bếp</button>';
  h += '</div>';
  if (r.note) h += '<p class="note">' + esc(r.note) + '</p>';
  return h + grid(r.code) + '</section>';
}
function render() {
  document.getElementById('tabs').innerHTML = BR.map((b) => '<button aria-pressed="' + (b.id === branch) + '" data-b="' + b.id + '">' + esc(b.name) + '<span class="n">' + D.rooms.filter((r) => r.branch === b.id).length + '</span></button>').join('');
  const b = BR.find((x) => x.id === branch);
  const rs = D.rooms.filter((r) => r.branch === b.id);
  let h = '<div class="branch"><div class="bhead anim"><span class="eyebrow">Chi nhánh</span><div class="bname"><h2>' + esc(b.name) + '</h2>' + (b.isNew ? '<span class="newb">NEW · Chi nhánh mới</span>' : '') + '</div><div class="binfo"><span class="addr">' + PIN + esc(b.address) + '</span><span class="muted">' + rs.length + ' phòng</span><a class="mapbtn" href="' + b.map + '" target="_blank" rel="noopener">' + PIN + 'Mở Google Maps</a></div></div>';
  if (b.id === 'lmx') {
    TY.forEach((t) => {
      const tr = rs.filter((r) => r.type === t.id);
      if (!tr.length) return;
      h += '<div class="type"><div class="thead anim"><h3>' + esc(t.name) + '</h3>' + chips(t.desc) + '</div>' + tr.map(room).join('') + '</div>';
    });
  } else {
    h += rs.map(room).join('');
  }
  document.getElementById('content').innerHTML = h + '</div>';
}
document.getElementById('tabs').addEventListener('click', (e) => {
  const btn = e.target.closest('button[data-b]'); if (!btn) return;
  branch = btn.dataset.b; render();
  window.scrollTo({ top: 0, behavior: 'smooth' });
});

const lb = document.getElementById('lb'), lbImg = document.getElementById('lbImg'), lbCap = document.getElementById('lbCap');
let cur = null;
function show() {
  const s = sets[cur.k], p = s.photos[cur.i];
  lbImg.style.animation = 'none'; void lbImg.offsetWidth; lbImg.style.animation = '';
  lbImg.src = p.src; lbImg.alt = s.label + ' – ' + p.cap;
  lbCap.textContent = s.label + ' · ' + p.cap + ' · ' + (cur.i + 1) + '/' + s.photos.length;
}
function open(k, i) { cur = { k, i }; show(); lb.classList.add('open'); document.body.style.overflow = 'hidden'; document.getElementById('lbClose').focus(); }
function close() { lb.classList.remove('open'); document.body.style.overflow = ''; cur = null; }
function step(d) { const n = sets[cur.k].photos.length; cur.i = (cur.i + d + n) % n; show(); }
document.getElementById('content').addEventListener('click', (e) => {
  const b = e.target.closest('[data-k]'); if (b) open(b.dataset.k, +b.dataset.i);
});
document.getElementById('lbClose').onclick = close;
document.getElementById('lbPrev').onclick = () => step(-1);
document.getElementById('lbNext').onclick = () => step(1);
lb.addEventListener('click', (e) => { if (e.target === lb) close(); });
document.addEventListener('keydown', (e) => {
  if (!cur) return;
  if (e.key === 'Escape') close(); else if (e.key === 'ArrowLeft') step(-1); else if (e.key === 'ArrowRight') step(1);
});
let tx = null;
lb.addEventListener('touchstart', (e) => { tx = e.touches[0].clientX; }, { passive: true });
lb.addEventListener('touchend', (e) => { if (tx === null) return; const dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) step(dx < 0 ? 1 : -1); tx = null; });
render();
</script>
</body>
</html>
